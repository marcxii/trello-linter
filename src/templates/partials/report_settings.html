<div class="report-overlay" role="dialog" aria-modal="true" aria-label="Report settings">
  <button
    class="report-backdrop"
    type="button"
    aria-label="Close report settings"
    onclick="document.getElementById('overlay-root').innerHTML=''"
  ></button>

  <div class="report-panel report-panel-settings">
    <div class="report-page report-settings-page">
      <div class="header">
        <div>
          <h1 style="margin:0;">Report Settings</h1>
          <div class="meta">Adjust which rules are calculated for this report.</div>
        </div>
        <div class="actions no-print">
          <button class="btn" type="button" onclick="document.getElementById('overlay-root').innerHTML=''">
            Close
          </button>
        </div>
      </div>

      <div class="card" style="margin-top:16px;">
        <h2>Coming soon</h2>
        <p class="muted">Settings UI will live here.</p>

        <form style="margin-top:16px;">
          <div class="field">
            <label for="minCards">Minimum cards per rule</label>
            <input id="minCards" type="number" min="0" value="3" />
          </div>

          <div class="field" style="margin-top:12px;">
            <label for="ageThreshold">Overdue threshold</label>
            <select id="ageThreshold">
              <option value="7">7 days</option>
              <option value="14" selected>14 days</option>
              <option value="30">30 days</option>
            </select>
          </div>

          <div class="field" style="margin-top:12px;">
            <label>
              <input type="checkbox" checked />
              Include archived cards
            </label>
          </div>

          <div class="field" style="margin-top:12px;">
            <label>
              <input type="checkbox" />
              Ignore cards without due dates
            </label>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
