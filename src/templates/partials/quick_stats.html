<div class="quick-title" id="quickStatsTitle">Quick Stats</div>
<div class="quick-line"><strong>Board:</strong> {{ board_name }}</div>
<div class="quick-line">
  <strong>Created:</strong>
  <span class="js-localize-timestamp" data-iso="{{ generated_at }}">{{ generated_at }}</span>
</div>
<div class="quick-line"><strong>Cards:</strong> {{ cards_count }}</div>
<div class="quick-line"><strong>Lists:</strong> {{ lists_count }}</div>
<div class="quick-line"><strong>Members:</strong> {{ members_count }}</div>
