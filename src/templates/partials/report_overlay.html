<div class="report-overlay" id="report-overlay" role="dialog" aria-modal="true" aria-label="Printable report">
  <button class="report-backdrop" type="button" aria-label="Close printable report"
    onclick="document.getElementById('overlay-root').innerHTML=''"></button>

  <div class="report-panel">
    <div class="report-page">
      <div class="header">
        <div>
          <h1 style="margin:0;">TrelloScore Report</h1>
        </div>

        <div class="actions no-print">
          <button class="btn-base btn-secondary btn-size-sm" type="button" onclick="window.print()">Print / Save as PDF</button>
          <button class="btn-base btn-secondary btn-size-sm" type="button" onclick="document.getElementById('overlay-root').innerHTML=''">Back to
            Report</button>
        </div>
      </div>

      <div class="grid">
        {% include "partials/report_scorecard.html" %}

        <div class="card">
          {% include "partials/quick_stats.html" %}
        </div>
      </div>

        {% set view_mode = "overlay" %}
        {% include "partials/findings_by_rule.html" %}

      </div>
    </div>
  </div>
</div>
