<div
  class="upload-section"
  id="dropZone"
  role="button"
  tabindex="0"
  aria-controls="fileInput"
  aria-describedby="uploadHelp"
  aria-label="Upload Trello JSON file"
>
  <div class="upload-icon" aria-hidden="true">📤</div>
  <div class="upload-text">Drop your Trello JSON file here</div>
  <div class="upload-subtext" id="uploadHelp">or click to browse</div>

  <form
    class="upload-form"
    id="uploadForm"
    hx-post="/partials/analyze"
    hx-target="#content"
    hx-swap="innerHTML"
    hx-encoding="multipart/form-data"
  >
    <label class="sr-only" for="fileInput">Trello JSON file</label>
    <input type="file" id="fileInput" name="file" accept=".json" required />

    <div class="file-info">
      <div class="file-name" id="fileName"></div>
      <div class="file-size" id="fileSize"></div>
    </div>

    <div class="actions">
      <button class="btn is-hidden" type="submit">Analyze Board</button>
    </div>
  </form>
</div>

<div
  class="error {% if message %}active{% endif %}"
  id="errorMsg"
  role="alert"
  aria-live="assertive"
>
  {{ message or "" }}
</div>
