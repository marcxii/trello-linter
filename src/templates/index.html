<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrelloScore</title>

  <!-- Global styles (moved out of template) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔍 TrelloScore</h1>
      <p>Analyze your Trello boards for best practices and quality standards</p>
    </div>

    <!--
      Single-page shell: all UI states (upload/loading/results/errors)
      render as partials and are swapped into this container.
    -->
    <div
      class="content"
      id="content"
      hx-get="/partials/upload"
      hx-trigger="load"
      hx-swap="innerHTML"
    >
      <!-- Upload partial loads here -->
    </div>
  </div>

  <!-- HTMX for partial swapping -->
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>

  <!-- Optional: lightweight client-side enhancements (drag/drop polish, etc.) -->
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
