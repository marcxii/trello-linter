<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trello Board Linter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .content {
            padding: 40px;
        }

        .upload-section {
            border: 3px dashed #e0e0e0;
            border-radius: 12px;
            padding: 60px 40px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-section:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .upload-section.dragover {
            border-color: #667eea;
            background: #f0f2ff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4em;
            margin-bottom: 20px;
            color: #667eea;
        }

        .upload-text {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 10px;
        }

        .upload-subtext {
            color: #666;
            font-size: 0.95em;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .file-info {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 8px;
            display: none;
        }

        .file-info.active {
            display: block;
        }

        .file-name {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 5px;
        }

        .file-size {
            color: #666;
            font-size: 0.9em;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 30px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
            margin-top: 30px;
        }

        .results.active {
            display: block;
        }

        .score-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
        }

        .score-number {
            font-size: 4em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .score-label {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .category-scores {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .category-item {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .category-score {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .category-name {
            font-size: 0.9em;
            color: #666;
        }

        .findings-summary {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .findings-count {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .export-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #f8f9ff;
        }

        .error {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
            padding: 20px;
            border-radius: 8px;
            color: #721c24;
            display: none;
        }

        .error.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Trello Board Linter</h1>
            <p>Analyze your Trello boards for best practices and quality standards</p>
        </div>

        <div class="content">
            <div class="upload-section" id="dropZone">
                <div class="upload-icon">📤</div>
                <div class="upload-text">Drop your Trello JSON file here</div>
                <div class="upload-subtext">or click to browse</div>
                <input type="file" id="fileInput" accept=".json">
                <button class="btn" onclick="document.getElementById('fileInput').click()">
                    Select File
                </button>
            </div>

            <div class="file-info" id="fileInfo">
                <div class="file-name" id="fileName"></div>
                <div class="file-size" id="fileSize"></div>
                <button class="btn" id="analyzeBtn" onclick="analyzeFile()">
                    Analyze Board
                </button>
            </div>

            <div class="error" id="errorMsg"></div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Analyzing your Trello board...</p>
            </div>

            <div class="results" id="results">
                <div class="score-card">
                    <div class="score-number" id="overallScore">--</div>
                    <div class="score-label">Overall Quality Score</div>
                </div>

                <div class="category-scores" id="categoryScores">
                    <!-- Populated dynamically -->
                </div>

                <div class="findings-summary" id="findingsSummary">
                    <div class="findings-count">
                        Total Findings: <span id="totalFindings">0</span>
                    </div>
                    <div>
                        🔴 Critical: <span id="criticalCount">0</span> |
                        🟠 Major: <span id="majorCount">0</span> |
                        🟡 Minor: <span id="minorCount">0</span>
                    </div>
                </div>

                <div class="export-buttons">
                    <button class="btn" onclick="exportCSV()">
                        📊 Export CSV
                    </button>
                    <button class="btn btn-secondary" onclick="exportHTML()">
                        📄 Export HTML Report
                    </button>
                    <button class="btn btn-secondary" onclick="resetApp()">
                        🔄 Analyze Another Board
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let uploadedFile = null;
        let analysisResults = null;

        // Drag and drop functionality
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelect(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        function handleFileSelect(file) {
            if (!file.name.endsWith('.json')) {
                showError('Please select a valid JSON file');
                return;
            }

            uploadedFile = file;
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = formatBytes(file.size);
            document.getElementById('fileInfo').classList.add('active');
            hideError();
        }

        async function analyzeFile() {
            if (!uploadedFile) return;

            document.getElementById('loading').classList.add('active');
            document.getElementById('analyzeBtn').disabled = true;

            const formData = new FormData();
            formData.append('file', uploadedFile);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('Analysis failed');
                }

                analysisResults = await response.json();
                displayResults(analysisResults);
            } catch (error) {
                showError('Failed to analyze file: ' + error.message);
            } finally {
                document.getElementById('loading').classList.remove('active');
                document.getElementById('analyzeBtn').disabled = false;
            }
        }

        function displayResults(data) {
            document.getElementById('overallScore').textContent = data.scores.overall_score.toFixed(1);
            
            // Display category scores
            const categoryScoresDiv = document.getElementById('categoryScores');
            categoryScoresDiv.innerHTML = '';
            
            for (const [category, score] of Object.entries(data.scores.category_scores)) {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'category-item';
                categoryDiv.innerHTML = `
                    <div class="category-score">${score.toFixed(1)}</div>
                    <div class="category-name">${category}</div>
                `;
                categoryScoresDiv.appendChild(categoryDiv);
            }

            // Display findings summary
            document.getElementById('totalFindings').textContent = data.scores.total_findings;
            document.getElementById('criticalCount').textContent = data.scores.critical_findings;
            document.getElementById('majorCount').textContent = data.scores.major_findings;
            document.getElementById('minorCount').textContent = data.scores.minor_findings;

            document.getElementById('results').classList.add('active');
        }

        function exportCSV() {
            window.location.href = '/export/csv';
        }

        function exportHTML() {
            window.open('/export/html', '_blank');
        }

        function resetApp() {
            uploadedFile = null;
            analysisResults = null;
            document.getElementById('fileInfo').classList.remove('active');
            document.getElementById('results').classList.remove('active');
            document.getElementById('fileInput').value = '';
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = message;
            errorDiv.classList.add('active');
        }

        function hideError() {
            document.getElementById('errorMsg').classList.remove('active');
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }
    </script>
</body>
</html>
