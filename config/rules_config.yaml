# Trello Board Linter - Rules Configuration

# List Detection Keywords
lists:
  backlog_keywords:
    - "backlog"
    - "to do"
  
  in_progress_keywords:
    - "in progress"
    - "doing"
    - "development"
  
  done_keywords:
    - "done"
    - "complete"
    - "deploy"

# Rule Weights (relative, normalized across active scored rules).
# Overall score uses a weighted average of per-rule scores:
#   overall = Σ(weight_i * rule_score_i) / Σ(active_weights)
# Only ratios matter (e.g., all 1s == all 10s).
weights:
  card_ownership: 1.0               # rule_id: card_ownership
  card_due_date: 1.0                # rule_id: card_due_date
  card_descriptiveness: 1.0         # rule_id: card_descriptiveness
  story_point_estimation: 1.0       # rule_id: story_point_estimation
  past_due_violation: 1.0           # rule_id: past_due_violation
  progress_threshold: 1.0           # rule_id: progress_threshold
  progress_monitoring: 1.0          # rule_id: progress_monitoring
  card_completion: 1.0              # rule_id: card_completion
  card_effort: 1.0                  # rule_id: card_effort
  description_canonicalization: 1.0 # rule_id: description_canonicalization

# rule_id: card_ownership
card_ownership:
  enabled: true
  description: "Cards outside Backlog must have an assigned member."

# rule_id: card_due_date
card_due_date:
  enabled: true
  description: "Open cards in In Progress must have a due date."

# rule_id: card_descriptiveness
card_descriptiveness:
  enabled: true
  minimum_desc_char: 20
  description: "Cards must have a description at or above the minimum length."

# rule_id: story_point_estimation
story_point_estimation:
  enabled: true
  sp_regex_patterns:
    - "\\bStory[\\s_-]*Point[s]?\\b\\s*(?::|=|-|is)?\\s*(\\d+(?:\\.\\d+)?)"
    - "\\bSP\\b\\s*(?::|=|-|is)?\\s*(\\d+(?:\\.\\d+)?)"
    - "\\bPts?\\b\\s*(?::|=|-|is)?\\s*(\\d+(?:\\.\\d+)?)"
    - "\\bPoints?\\b\\s*(?::|=|-|is)?\\s*(\\d+(?:\\.\\d+)?)"
    - "\\bPoint[\\s_-]*Value\\b\\s*(?::|=|-|is)?\\s*(\\d+(?:\\.\\d+)?)"
    - "\\bSize\\b\\s*(?::|=|-|is)?\\s*(\\d+(?:\\.\\d+)?)"
  description: "Cards must include story points in the description."

# rule_id: past_due_violation
past_due_violation:
  enabled: true
  description: "Open cards with due dates are not past due unless marked complete."

# rule_id: progress_threshold
progress_threshold:
  enabled: true
  max_wip_per_member: 3
  description: "Cards assigned to a member must not exceed the Work In Progress limit."

# rule_id: progress_monitoring
progress_monitoring:
  enabled: true
  threshold_num_days: 5
  description: "Open In Progress cards have no activity beyond the day threshold."

# rule_id: card_completion
card_completion:
  enabled: true
  description: "Completed cards must not be in an In Progress or Backlog list."

# rule_id: card_effort
card_effort:
  enabled: true
  effort_regex_patterns:
    - "\\bEffort(?:[\\s_-]*(?:Hours?|Minutes?))?\\b\\s*(?::|=|-|is)?\\s*(\\d+(?:\\.\\d+)?)\\s*(?:h|hr|hrs|hours?|m|min|mins|minutes?)?"
    - "\\b(?:Estimate|Estimation|Estimated[\\s_-]*Hours?|Estimated[\\s_-]*Time|Time[\\s_-]*Estimate|Est)\\b\\s*(?::|=|-|is)?\\s*(\\d+(?:\\.\\d+)?)\\s*(?:h|hr|hrs|hours?|m|min|mins|minutes?)?"
    - "\\bHours?\\b\\s*(?::|=|-|is)?\\s*(\\d+(?:\\.\\d+)?)"
    - "\\bMinutes?\\b\\s*(?::|=|-|is)?\\s*(\\d+(?:\\.\\d+)?)"
    - "\\b(?:Dev|Engineering)[\\s_-]*Effort\\b\\s*(?::|=|-|is)?\\s*(\\d+(?:\\.\\d+)?)"
  description: "Cards must include an effort/time estimate in the description."

# rule_id: description_canonicalization
description_canonicalization:
  enabled: true
  story_formats:
    # As ... I/we ... (need/have/must/want/would like to) ... (so that/so I can/so we can/to/in order to) ...
    - "^\\s*As\\s+(?:a|an|the)\\s+[^,]+\\s*,?\\s*(?:I|we)\\s+(?:need|have|want|would like)\\s+to\\s+.+?\\s*,?\\s*(?:so that|so (?:I|we) can|to|in order to)\\s+.+\\.?$"
    - "^\\s*As\\s+[^,]+\\s*,?\\s*(?:I|we)\\s+(?:need|have|want|would like)\\s+to\\s+.+?\\s*,?\\s*(?:so that|so (?:I|we) can|to|in order to)\\s+.+\\.?$"
    - "^\\s*As\\s+[^,]+\\s*,?\\s*(?:I|we)\\s+must\\s+.+?\\s*,?\\s*(?:so that|so (?:I|we) can|to|in order to)\\s+.+\\.?$"
    - "^\\s*As\\s+[^,]+\\s*,?\\s*(?:I|we)\\s+want\\s+.+?\\s*,?\\s*(?:so that|so (?:I|we) can|to|in order to)\\s+.+\\.?$"
    - "^\\s*As\\s+[^,]+\\s*,?\\s*(?:I|we)\\s+plan\\s+to\\s+.+?\\s*,?\\s*(?:so that|so (?:I|we) can|so the team can|so our team can|so everyone can|to|in order to)\\s+.+\\.?$"
    - "^\\s*As\\s+(?:a|an|the)\\s+[^,]+\\s*,?\\s*(?:I|we)\\s+(?:will|can)\\s+.+?\\s*,?\\s*(?:so that|so (?:I|we) can|so the team can|so our team can|so everyone can|to|in order to)\\s+.+\\.?$"
    - "^\\s*As\\s+[^,]+\\s*,?\\s*(?:I|we)\\s+(?:will|can)\\s+.+?\\s*,?\\s*(?:so that|so (?:I|we) can|so the team can|so our team can|so everyone can|to|in order to)\\s+.+\\.?$"
    # As member(s) of/part of/team ... we ... (need/plan/will/can) ... so ...
    - "^\\s*As\\s+(?:a\\s+member of|members of|part of)\\s+[^,]+\\s*,?\\s*we\\s+(?:need|have|must|want|would like|plan|will|can)\\s+to\\s+.+?\\s*,?\\s*(?:so that|so we can|so the team can|so our team can|so everyone can|to|in order to)\\s+.+\\.?$"
    - "^\\s*As\\s+(?:a\\s+team|a\\s+development\\s+team|the\\s+project\\s+team|[^,]+\\s+members)\\s*,?\\s*we\\s+(?:need|have|must|want|would like|plan|will|can)\\s+to\\s+.+?\\s*,?\\s*(?:so that|so we can|so the team can|so our team can|so everyone can|to|in order to)\\s+.+\\.?$"
    - "^\\s*As\\s+(?:a\\s+member of|members of|part of)\\s+[^,]+\\s*,?\\s*we\\s+(?:will|can)\\s+.+?\\s*,?\\s*(?:so that|so we can|so the team can|so our team can|so everyone can|to|in order to)\\s+.+\\.?$"
    - "^\\s*As\\s+(?:a\\s+team|a\\s+development\\s+team|the\\s+project\\s+team|[^,]+\\s+members)\\s*,?\\s*we\\s+(?:will|can)\\s+.+?\\s*,?\\s*(?:so that|so we can|so the team can|so our team can|so everyone can|to|in order to)\\s+.+\\.?$"
    # As we (the <team/group>) ... we ...
    - "^\\s*As\\s+we\\s+\\([^\\)]+\\)\\s*,?\\s*we\\s+(?:need|have|must|want|would like|plan|will|can)\\s+to\\s+.+?\\s*,?\\s*(?:so that|so we can|so the team can|so our team can|so everyone can|to|in order to)\\s+.+\\.?$"
    - "^\\s*As\\s+we\\s+\\([^\\)]+\\)\\s*,?\\s*we\\s+(?:will|can)\\s+.+?\\s*,?\\s*(?:so that|so we can|so the team can|so our team can|so everyone can|to|in order to)\\s+.+\\.?$"
    # As someone responsible/accountable/owner/stakeholder/user of ... I/we ...
    - "^\\s*As\\s+someone\\s+responsible\\s+for\\s+[^,]+\\s*,?\\s*(?:I|we)\\s+(?:need|have|must|want|would like|plan|will|can)\\s+to\\s+.+?\\s*,?\\s*(?:so that|so (?:I|we) can|to|in order to)\\s+.+\\.?$"
    - "^\\s*As\\s+the\\s+person\\s+accountable\\s+for\\s+[^,]+\\s*,?\\s*(?:I|we)\\s+(?:need|have|must|want|would like|plan|will|can)\\s+to\\s+.+?\\s*,?\\s*(?:so that|so (?:I|we) can|to|in order to)\\s+.+\\.?$"
    - "^\\s*As\\s+the\\s+owner\\s+of\\s+[^,]+\\s*,?\\s*(?:I|we)\\s+(?:need|have|must|want|would like|plan|will|can)\\s+to\\s+.+?\\s*,?\\s*(?:so that|so (?:I|we) can|to|in order to)\\s+.+\\.?$"
    - "^\\s*As\\s+(?:a\\s+stakeholder\\s+in|a\\s+user\\s+of)\\s+[^,]+\\s*,?\\s*(?:I|we)\\s+(?:need|have|must|want|would like|plan|will|can)\\s+to\\s+.+?\\s*,?\\s*(?:so that|so (?:I|we) can|so the team can|so our team can|so everyone can|to|in order to)\\s+.+\\.?$"
    - "^\\s*As\\s+stakeholders\\s+in\\s+[^,]+\\s*,?\\s*we\\s+(?:need|have|must|want|would like|plan|will|can)\\s+to\\s+.+?\\s*,?\\s*(?:so that|so we can|so the team can|so our team can|so everyone can|to|in order to)\\s+.+\\.?$"
    # As ... I/we am/are responsible/accountable/tasked with ... so ...
    - "^\\s*As\\s+[^,]+\\s*,?\\s*(?:I|we)\\s*(?:['’]?(?:m|am)|are|['’]?re)\\s+(?:responsible|accountable|tasked)\\s+with\\s+.+?\\s*,?\\s*(?:so that|so (?:I|we) can|so the team can|so our team can|to|in order to)\\s+.+\\.?$"
    - "^\\s*As\\s+[^,]+\\s*,?\\s*(?:I|we)\\s*(?:['’]?(?:m|am)|are|['’]?re)\\s+(?:responsible|accountable)\\s+for\\s+.+?\\s*,?\\s*(?:so that|so (?:I|we) can|so the team can|so our team can|to|in order to)\\s+.+\\.?$"
    # As ... I/we should be able to ... so ...
    - "^\\s*As\\s+[^,]+\\s*,?\\s*(?:I|we)\\s+should\\s+be\\s+able\\s+to\\s+.+?\\s*,?\\s*(?:so that|so (?:I|we) can|to|in order to)\\s+.+\\.?$"
    # Given/When/Then canonical form
    - "^\\s*Given\\s+.+,\\s*[Ww]hen\\s+.+,\\s*[Tt]hen\\s+.+$"
  description: "Cards with descriptions must follow an accepted story format (e.g. As a.. I need.. So that.. OR Given.. When.. Then..)."

# Scoring
scoring:
  # Effective denominator stabilization for per-rule penalty:
  #   penalty_pct = (k * fail_count / max(eligible_count, n0)) * 100
  #   rule_score = max(0, 100 - penalty_pct)
  effective_denominator:
    enabled: true
    n0: 20
    k: 1.5

  grade_thresholds:
    excellent: 90
    good: 80
    needs_improvement: 70
    poor: 60
