- question: "What is a Trello JSON file?"
  answer: "A Trello JSON file is a board export that includes your lists, cards, members, etc. in a structured format."
- question: "How do I get a Trello JSON file?"
  answer: "Open your Trello board, click the three-dot menu in the upper right, choose \"Print, export, and share\", then click \"Export as JSON\" to download the file."
- question: "What does my score mean?"
  answer: "It summarizes overall board quality based on the rules that were evaluated."
- question: "Does TrelloScore modify my Trello board?"
  answer: "No. It performs read-only analysis on an uploaded snapshot."
- question: "Why do some issues not point to a specific card?"
  answer: "Some checks are aggregate and reflect overall board patterns rather than a single card."
- question: "What happens to my data after analysis?"
  answer: "We don’t store data long-term. Results may be kept briefly for refresh or export."
- question: "How can I change the rule thresholds?"
  answer:
    - "• Upload and analyze a board JSON file."
    - "• Click \"Change Report Settings\" to open the panel."
    - "• Adjust thresholds and click \"Apply\" to reload the report."
- question: "Why do I see different results after uploading the same board?"
  answer: "Time-based checks (like overdue cards) depend on the current date and time, so results can change day to day."
